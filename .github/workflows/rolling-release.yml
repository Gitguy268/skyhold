name: Rolling release

# Keeps one GitHub Release, tagged `latest`, in step with the newest commit on `main`:
# the tag is moved to that commit and the assets are rebuilt and replaced on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling-release
  cancel-in-progress: true

jobs:
  build:
    name: Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-compile
        run: |
          set -euo pipefail
          mkdir -p out
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            name=skyhold-$os-$arch
            mkdir -p "build/$name"
            if ! ( set -e; CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "build/$name/skyhold$ext" ./cmd/skyhold ); then
              echo "::warning::$t does not build, skipped"; rm -rf "build/$name"; continue
            fi
            for f in LICENSE* NOTICE* README.md; do [ -e "$f" ] && cp -r "$f" "build/$name/"; done
            if [ "$os" = windows ]; then (cd build && zip -qr "../out/$name.zip" "$name"); else tar -C build -czf "out/$name.tar.gz" "$name"; fi
          done
          [ -n "$(ls -A out)" ] || { echo "::error::no target built"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: rolling-go
          path: out/*
          if-no-files-found: error

  publish:
    name: Update the rolling release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rolling-*
          path: out
          merge-multiple: true
      - name: Move the latest tag and replace the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: main
          PRERELEASE: "false"
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -n "$(ls -A out)" ]; then (cd out && sha256sum -- * > SHA256SUMS.txt); fi
          ls -l out
          notes="Built automatically from the latest commit on \`$BRANCH\` ([\`${SHA::7}\`](https://github.com/$GH_REPO/commit/$SHA), $(date -u '+%Y-%m-%d %H:%M UTC')). This release is replaced on every push, so it can change at any time."
          # Point the tag at this commit (create it the first time).
          if gh api "repos/$GH_REPO/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$SHA" > /dev/null
          fi
          if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); else flags=(--prerelease=false --latest); fi
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "Rolling Release" --notes "$notes" "${flags[@]}"
            # Drop assets that this build no longer produces.
            gh release view latest --json assets --jq '.assets[].name' | while IFS= read -r a; do
              [ -e "out/$a" ] || gh release delete-asset latest "$a" --yes
            done
          else
            gh release create latest --verify-tag --title "Rolling Release" --notes "$notes" "${flags[@]}"
          fi
          if [ -n "$(ls -A out)" ]; then gh release upload latest out/* --clobber; fi
